parameters:
  - name: VSCODE_ARCH
    type: string
  - name: VSCODE_CIBUILD
    type: boolean
  - name: VSCODE_QUALITY
    type: string
  - name: VSCODE_TEST_IDS
    type: object
    default: []
  - name: VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL
    type: boolean
    default: false
  - name: VSCODE_BUILD_LINUX_SNAP
    type: boolean
    default: false
  - name: VSCODE_RUN_CHECKS
    type: boolean
    default: false
  - name: VSCODE_BUILD_ONLY
    type: boolean
    default: false
  - name: VSCODE_RUN_CHECKS
    type: boolean
    default: false
  - name: VSCODE_SKIP_SUCCESSFUL_TEST_TASKS
    type: boolean

steps:
  - template: product-build-linux-setup.yml@self
    parameters:
      VSCODE_CIBUILD: ${{ parameters.VSCODE_CIBUILD }}
      VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL: ${{ parameters.VSCODE_SKIP_FOUNDRY_LOCAL_INSTALL }}
      VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}

  # Start pulling the CG-generated NOTICE from the parallel Quality stage
  # in the background (overwrites repo-root ThirdPartyNotices.txt before packaging).
  # Publish builds only (CIBUILD=false) — CI test jobs never ship a notice.
  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - script: npx deemon@1.13.7 --detach --wait -- node build/azure-pipelines/common/downloadNotice.ts
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        VSCODE_OVERWRITE_TPN: $(VSCODE_OVERWRITE_TPN)
      displayName: Pull CG NOTICE (background)

  - script: |
      set -e
      if [ "$VSCODE_QUALITY" = "insider" ] || [ "$VSCODE_QUALITY" = "exploration" ]; then
        node build/azure-pipelines/common/apply-patch-version.js $VSCODE_PATCH_VERSION
      else
        echo "Skipping patch version update for quality: $VSCODE_QUALITY"
      fi
    displayName: Apply auto-incremented patch version
    env:
      VSCODE_QUALITY: $(VSCODE_QUALITY)
      VSCODE_PATCH_VERSION: $(VSCODE_PATCH_VERSION)

  - template: ../../common/install-builtin-extensions.yml@self

  - script: node build/npm/electronTypes.ts
    displayName: Prepare Electron types

  - ${{ if ne(parameters.VSCODE_ARCH, 'armhf') }}:
    - template: ../../common/agent-sdk-produce.yml@self
      parameters:
        vscodePlatform: linux

    - template: ../../common/dictation-runtime-produce.yml@self
      parameters:
        vscodePlatform: linux

  - template: ../../common/mixin-vscode-capi.yml@self

  - script: npm run gulp core-ci
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
    displayName: Compile

  - script: |
      set -e
      echo "Disk usage after Compile:"
      df -h
    displayName: Check disk space (after Compile)

  - ${{ if eq(parameters.VSCODE_ARCH, 'x64') }}:
    - script: node build/azure-pipelines/common/extract-telemetry.ts
      displayName: Generate lists of telemetry events

  - ${{ if gt(length(parameters.VSCODE_TEST_IDS), 0) }}:
    - script: |
        set -e
        npm run compile --prefix test/smoke
        npm run compile --prefix test/integration/browser
      displayName: Compile test suites (non-OSS)
      condition: and(succeeded(), eq(variables['VSCODE_STEP_ON_IT'], 'false'))

  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - script: npm run copy-policy-dto --prefix build && node build/lib/policies/policyGenerator.ts build/lib/policies/policyData.jsonc linux
      displayName: Generate policy definitions
      retryCountOnTaskFailure: 3

  # Block on the CG NOTICE download and overwrite ThirdPartyNotices.txt
  # right before gulp packages it. Non-fatal: falls back to legacy on any problem.
  - ${{ if ne(parameters.VSCODE_CIBUILD, true) }}:
    - script: npx deemon@1.13.7 --attach -- node build/azure-pipelines/common/downloadNotice.ts
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
        VSCODE_OVERWRITE_TPN: $(VSCODE_OVERWRITE_TPN)
      displayName: Apply CG NOTICE
      # deemon --attach can exit non-zero if the background daemon died; never fail for that.
      continueOnError: true

  # armhf has no @github/copilot platform package, so nothing is built for it.
  - ${{ if ne(parameters.VSCODE_ARCH, 'armhf') }}:
      - template: ../../copilot/download-runtime-artifact.yml@self
        parameters:
          VSCODE_COPILOT_TARGET: linux-${{ parameters.VSCODE_ARCH }}

  - script: |
      set -e
      npm run gulp vscode-linux-$(VSCODE_ARCH)-min-ci
    env:
      GITHUB_TOKEN: "$(github-token-code-oss)"
      AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
    displayName: Build client

  - ${{ if ne(parameters.VSCODE_ARCH, 'armhf') }}:
    - script: |
        set -e
        npm run gulp vscode-reh-linux-$(VSCODE_ARCH)-min-ci
        mv ../vscode-reh-linux-$(VSCODE_ARCH) ../vscode-server-linux-$(VSCODE_ARCH) # TODO@joaomoreno
        echo "##vso[task.setvariable variable=SERVER_UNARCHIVE_PATH]`pwd`/../vscode-server-linux-$(VSCODE_ARCH)"
      env:
        GITHUB_TOKEN: "$(github-token-code-oss)"
        AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
      displayName: Build server

    # Compile-only CI jobs, such as flaky-smoke builds, also check the packaged host.
    - ${{ if and(eq(parameters.VSCODE_ARCH, 'x64'), or(ne(parameters.VSCODE_CIBUILD, true), eq(length(parameters.VSCODE_TEST_IDS), 0), containsValue(parameters.VSCODE_TEST_IDS, 'smoke-electron'))) }}:
      - script: node build/azure-pipelines/common/smokeTestAgentHost.ts "$(Agent.BuildDirectory)/vscode-server-linux-$(VSCODE_ARCH)"
        displayName: 🧪 Smoke test packaged Agent Host

    - script: |
        set -e
        npm run gulp vscode-reh-web-linux-$(VSCODE_ARCH)-min-ci
        mv ../vscode-reh-web-linux-$(VSCODE_ARCH) ../vscode-server-linux-$(VSCODE_ARCH)-web # TODO@joaomoreno
      env:
        GITHUB_TOKEN: "$(github-token-code-oss)"
        AZURE_DEVOPS_EXT_PAT: $(System.AccessToken)
      displayName: Build server (web)

  - ${{ if eq(parameters.VSCODE_RUN_TESTS_IN_PARALLEL, true) }}:
      - template: ../../common/product-test-artifacts.yml@self
        parameters:
          artifactPrefix: product-tests-linux-$(VSCODE_ARCH)
          prepareTestSteps:
            - script: |
                set -e
                npm run gulp \
                  compile-extension:configuration-editing \
                  compile-extension:css-language-features-server \
                  compile-extension:emmet \
                  compile-extension:git \
                  compile-extension:github-authentication \
                  compile-extension:html-language-features-server \
                  compile-extension:ipynb \
                  compile-extension:notebook-renderers \
                  compile-extension:json-language-features-server \
                  compile-extension:markdown-language-features \
                  compile-extension-media \
                  compile-extension:microsoft-authentication \
                  compile-extension:typescript-language-features \
                  compile-extension:vscode-api-tests \
                  compile-extension:vscode-colorize-tests \
                  compile-extension:vscode-colorize-perf-tests \
                  compile-extension:vscode-test-resolver
              displayName: Build integration tests
          archiveWorkspaceSteps:
            - script: |
                set -e
                mkdir -p $(Build.ArtifactStagingDirectory)/product-tests
                tar -czf $(Build.ArtifactStagingDirectory)/product-tests/repo.tar.gz --exclude=.git --exclude='node_modules' --exclude='*/node_modules' --exclude='.build/node_modules_cache' -C $(Build.SourcesDirectory) .
              displayName: Archive built workspace for tests
          archiveAppSteps:
            - script: tar -czf $(Build.ArtifactStagingDirectory)/product-tests/app.tar.gz -C $(Agent.BuildDirectory) VSCode-linux-$(VSCODE_ARCH)
              displayName: Archive packaged app for tests
          archiveServerSteps:
            - script: tar -czf $(Build.ArtifactStagingDirectory)/product-tests/server.tar.gz -C $(Agent.BuildDirectory) vscode-server-linux-$(VSCODE_ARCH)
              displayName: Archive packaged server for tests
          archiveWebSteps:
            - script: tar -czf $(Build.ArtifactStagingDirectory)/product-tests/web.tar.gz -C $(Agent.BuildDirectory) vscode-server-linux-$(VSCODE_ARCH)-web
              displayName: Archive packaged web server for tests

  - script: |
      set -e
      echo "Disk usage after web server build:"
      df -h
    displayName: Check disk space (after build server web)

  - ${{ if or(eq(parameters.VSCODE_ARCH, 'x64'), eq(parameters.VSCODE_ARCH, 'arm64')) }}:
    - script: |
        set -e

        EXPECTED_GLIBC_VERSION="2.28" \
        EXPECTED_GLIBCXX_VERSION="3.4.25" \
        VSCODE_SYSROOT_DIR="$(Build.SourcesDirectory)/.build/sysroots/glibc-2.28-gcc-8.5.0" \
        ./build/azure-pipelines/linux/verify-glibc-requirements.sh
      env:
        SEARCH_PATH: $(SERVER_UNARCHIVE_PATH)
        npm_config_arch: $(NPM_ARCH)
        VSCODE_ARCH: $(VSCODE_ARCH)
      displayName: Check GLIBC and GLIBCXX dependencies in server archive

  - ${{ if and(ne(parameters.VSCODE_CIBUILD, true), ne(parameters.VSCODE_BUILD_ONLY, true)) }}:
    - template: product-build-linux-package.yml@self
      parameters:
        VSCODE_ARCH: ${{ parameters.VSCODE_ARCH }}
        VSCODE_QUALITY: ${{ parameters.VSCODE_QUALITY }}
        VSCODE_BUILD_LINUX_SNAP: ${{ parameters.VSCODE_BUILD_LINUX_SNAP }}
        VSCODE_WAIT_FOR_CLI: true

  - ${{ if gt(length(parameters.VSCODE_TEST_IDS), 0) }}:
    - template: product-build-linux-test.yml@self
      parameters:
        VSCODE_TEST_IDS: ${{ parameters.VSCODE_TEST_IDS }}

  - ${{ if and(ne(parameters.VSCODE_CIBUILD, true), ne(parameters.VSCODE_BUILD_ONLY, true)) }}:
    - template: product-build-linux-package-finalize.yml@self
