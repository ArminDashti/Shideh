name: Cancellation A-B diagnostics (DO NOT MERGE)

on:
  pull_request:
    branches:
      - main
      - 'release/*'
      - '1.107/sessions'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare:
    if: github.head_ref == 'diagnostics/335076-cancellation-ab'
    runs-on: macos-26-xlarge
    timeout-minutes: 60
    env:
      VSCODE_QUALITY: oss
      VSCODE_ARCH: arm64
      NPM_ARCH: arm64
      VSCODE_SKIP_PRELAUNCH: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Save identical diagnostic instrumentation
        run: |
          git diff 6acb3aafa40acf016d00efd5230a97e446ecfa7e HEAD -- src/vs/platform/agentHost/test/node/e2e/harness/agentHostE2ETestHarness.ts > "$RUNNER_TEMP/cancellation.patch"
          git show HEAD:.github/cancellation-ab.sh > "$RUNNER_TEMP/cancellation-ab.sh"
          git diff --exit-code e341a3c1515af84f5f679761d76a05a02af182cd 6acb3aafa40acf016d00efd5230a97e446ecfa7e -- package.json package-lock.json .npmrc .nvmrc
      - name: Restore dependencies
        id: cache
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: node_modules-compile
          key-args: "compile $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libglib2.0-dev libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install Electron headers
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: node build/npm/preinstall.ts

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --break-system-packages setuptools
          npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Type check /build/ scripts
        run: npm run typecheck
        working-directory: build

      - name: Prepare built-in extensions cache key
        shell: pwsh
        run: node build/azure-pipelines/common/computeBuiltInDepsCacheKey.ts > .build/builtindepshash

      - name: Restore built-in extensions cache
        id: cache-builtin-extensions
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          enableCrossOsArchive: true
          path: .build/builtInExtensions
          key: "builtin-extensions-${{ hashFiles('.build/builtindepshash') }}"

      - name: Download built-in extensions
        if: steps.cache-builtin-extensions.outputs.cache-hit != 'true'
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Markdown editor manifests
        run: |
          npm run markdown-editor-package-json-check
          npm --prefix extensions/markdown-language-features run test-markdown-editor-package-json

      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Compile & Hygiene
        run: npm exec -- npm-run-all2 -lp core-ci hygiene eslint valid-layers-check startup-reachability-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Codex protocol client is in sync
        run: |
          git fetch --no-tags --depth=1 origin "$CODEX_SYNC_BASE" || true
          node build/codex/check-protocol-sync.ts --if-changed --base "$CODEX_SYNC_BASE"
        env:
          CODEX_SYNC_BASE: ${{ github.event.pull_request.base.sha }}

      - name: Check cyclic dependencies
        run: node build/lib/checkCyclicDependencies.ts out-build

  linux-cli-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-cli-test.yml
    with:
      job_name: CLI
      rustup_toolchain: 1.88

  linux-copilot-shim-tests:
    name: Linux Copilot Shim
    uses: ./.github/workflows/pr-linux-cli-test.yml
    with:
      job_name: Copilot-Shim
      rustup_toolchain: 1.88
      working_directory: copilot_shim
      format: true
      locked: true
      all_targets: true

  linux-electron-unit-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron-Unit
      electron_tests: true
      integration_tests: false
      smoke_tests: false

  # The other unit test jobs run with product.quality 'insider'. This one covers
  # 'stable' so stable-only test failures are caught before a stable build.
  # Linux only: product.quality comes from product.json and is the same on every
  # OS, so quality-dependent tests fail the same way on all of them.
  linux-electron-unit-tests-stable:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron-Unit (Stable)
      electron_tests: true
      integration_tests: false
      smoke_tests: false
      test_quality: stable

  linux-electron-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron
      electron_tests: true
      unit_tests: false
      smoke_tests: false

  linux-electron-smoke-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Electron-Smoke
      electron_tests: true
      unit_tests: false
      integration_tests: false

  linux-browser-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Browser
      browser_tests: true

  linux-remote-tests:
    name: Linux
    uses: ./.github/workflows/pr-linux-test.yml
    with:
      job_name: Remote
      remote_tests: true

  macos-electron-unit-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Electron-Unit
      electron_tests: true
      integration_tests: false
      smoke_tests: false

  macos-electron-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Electron
      electron_tests: true
      unit_tests: false
      smoke_tests: false

  macos-electron-smoke-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Electron-Smoke
      electron_tests: true
      unit_tests: false
      integration_tests: false

  macos-browser-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Browser
      browser_tests: true

  macos-remote-tests:
    name: macOS
    uses: ./.github/workflows/pr-darwin-test.yml
    with:
      job_name: Remote
      remote_tests: true

  windows-electron-unit-tests:
    name: Windows
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Electron-Unit
      electron_tests: true
      integration_tests: false
      smoke_tests: false

  windows-electron-tests:
    name: Windows
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Electron
      electron_tests: true
      unit_tests: false
      smoke_tests: false

  windows-electron-smoke-tests:
    name: Windows
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Electron-Smoke
      electron_tests: true
      unit_tests: false
      integration_tests: false

  windows-browser-tests:
    name: Windows
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Browser
      browser_tests: true

  windows-remote-tests:
    name: Windows
    uses: ./.github/workflows/pr-win32-test.yml
    with:
      job_name: Remote
      remote_tests: true
